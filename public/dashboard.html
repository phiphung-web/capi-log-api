<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAPI Log Platform</title>
    <link rel="stylesheet" href="/dashboard-assets/dashboard.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CP</div>
          <div>
            <strong>CAPI Platform</strong>
            <span>Market -> Product -> Logs</span>
          </div>
        </div>
        <nav class="nav">
          <div class="nav-label">Operate</div>
          <button data-screen="overview" class="active">Overview</button>
          <button data-screen="markets">Markets</button>
          <button data-screen="products">Products</button>
          <button data-screen="logs">Logs</button>
          <div class="nav-label" data-admin-only="true">Admin</div>
          <button data-screen="users" data-admin-only="true">Users</button>
        </nav>
        <div class="auth-box">
          <label>API/User token</label>
          <input id="tokenInput" type="password" placeholder="Bearer token">
          <button id="saveToken">Use token</button>
          <div class="divider"></div>
          <label>Login</label>
          <input id="usernameInput" type="text" placeholder="username">
          <input id="passwordInput" type="password" placeholder="password">
          <button id="loginBtn">Login</button>
          <button id="demoBtn" class="ghost">Demo data</button>
          <p id="authState"></p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="screenTitle">Overview</h1>
            <p id="screenSubtitle">Executive view across accessible markets and products.</p>
          </div>
          <div class="date-controls">
            <input id="dateFrom" placeholder="dd-mm-yyyy">
            <input id="dateTo" placeholder="dd-mm-yyyy">
            <button id="refreshBtn">Refresh</button>
          </div>
        </header>

        <section id="content"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-panel">
        <div class="modal-head">
          <h2>Event detail</h2>
          <button id="closeModal">Close</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="/dashboard-assets/dashboard.js"></script>
  </body>
</html>
